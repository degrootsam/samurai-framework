name: Setup
description: Install bun, Node and the locked dependencies

runs:
  using: composite
  steps:
    - uses: oven-sh/setup-bun@v2
      with:
        bun-version: 1.3.0
    # The test scripts run tsx on Node's test runner, which needs Node 22+ (fs/promises glob)
    - uses: actions/setup-node@v4
      with:
        node-version: 26
    - name: Install dependencies
      shell: bash
      run: bun install --frozen-lockfile
