name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/setup
      - name: Typecheck
        run: bunx tsc --noEmit -p .

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/setup
      # The flows/core bundle test needs the built package
      - name: Build
        run: bun run build
      - name: Unit tests
        run: bun run test

  browser:
    name: Browser tests (${{ matrix.browser }}, ${{ matrix.shard }}/6)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        browser: [firefox, chrome]
        # The tests run one file at a time, so the files are split over six jobs per browser, by their duration in
        # scripts/browser-timings.json. Six brings every job down to about the slowest file (run, ~75 s on Firefox)
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/setup
      - name: Browser cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/samurai/browsers
          key: browsers-${{ runner.os }}-${{ hashFiles('src/browsers/pins.ts') }}
      # Both: the multi-browser tests run Firefox and Chrome whichever browser the matrix leg tests with
      - name: Install the browsers
        run: bunx tsx src/index.ts browsers install all
      - name: Browser tests
        timeout-minutes: 12
        env:
          SAMURAI_TEST_BROWSER: ${{ matrix.browser }}
          # scripts/browser-shards.mjs picks this shard's files
          SAMURAI_TEST_SHARD: ${{ matrix.shard }}/6
          # Each file's duration, for refreshing scripts/browser-timings.json (see browser-shards.mjs)
          SAMURAI_TEST_TIMINGS: result/browser-timings.json
        run: bun run test:browser
      - name: Upload timings
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: browser-timings-${{ matrix.browser }}-${{ matrix.shard }}
          path: result/browser-timings.json
          retention-days: 30
          if-no-files-found: ignore
      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: browser-test-logs-${{ matrix.browser }}-${{ matrix.shard }}
          path: |
            logs/
            result/
          retention-days: 7
          if-no-files-found: ignore

  trunk:
    name: Code quality (Trunk)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      # Checks only what the PR or push changed; linters come from .trunk/trunk.yaml
      - uses: trunk-io/trunk-action@04ba50e7658c81db7356da96657e6e77f220bfa3 # v1.3.1
