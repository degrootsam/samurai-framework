name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Typecheck
        run: bunx tsc --noEmit -p .

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Unit tests
        run: bun run test

  browser:
    name: Browser tests (Firefox)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Firefox version
        run: firefox --version
      - name: Browser tests
        run: bun run test:browser
      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-logs
          path: |
            logs/
            result/
          retention-days: 7
          if-no-files-found: ignore
